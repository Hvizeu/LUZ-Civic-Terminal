name: Build LUZ with mod continuity
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/package.py --rid all
      - uses: actions/upload-artifact@v4
        with:
          name: LUZ-with-Continuity
          path: |
            dist/LUZ-Civic-Terminal-*.zip*
            dist/game-nivalisnights-luz-*.zip*
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LUZ-with-Continuity
          path: dist
      - name: Publish owner-tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $project = [xml](Get-Content Desktop/Desktop.csproj)
          $expected = 'v' + $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:GITHUB_REF_NAME -ne $expected) { throw 'Release tag and application version differ.' }
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; preserving its validated assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip,dist/*.sha256 | ForEach-Object FullName) --draft --verify-tag --title "LUZ Civic Terminal $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; no incomplete release will be published.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
